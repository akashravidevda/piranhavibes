<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Piranha Vibes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/brand/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ══════ LOGIN ══════ -->
<div class="adm-login" id="login">
  <div class="box">
    <img src="assets/img/brand/logo.png" alt="Piranha Vibes" style="height:52px;margin-bottom:22px">
    <h1 class="d3" style="font-size:1.5rem;margin-bottom:6px">Admin Console</h1>
    <p class="muted tiny" style="margin-bottom:24px">Enter your admin key to manage orders, pricing and stock.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="key">Admin key</label>
        <div class="pw">
          <input id="key" type="password" autocomplete="current-password" placeholder="••••••••" spellcheck="false">
          <button type="button" class="pw-eye" id="pwToggle" aria-label="Show admin key" aria-pressed="false">
            <svg class="eye-on" viewBox="0 0 24 24"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24"><path d="M4 4l16 16" stroke-linecap="round"/><path d="M9.9 5.2A9.9 9.9 0 0 1 12 5c6.2 0 10 6 10 6a17 17 0 0 1-3.3 3.7M6.4 7.6A17 17 0 0 0 2 11s3.8 6 10 6a9.7 9.7 0 0 0 3.7-.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <span class="msg" id="keyMsg">Incorrect key — please try again</span>
      </div>
      <p class="tiny hidden" id="capsWarn" style="color:var(--gold);margin:-8px 0 12px">⚠ Caps Lock is on</p>
      <label class="fopt" style="margin-bottom:6px"><input type="checkbox" id="remember"> Keep me signed in on this device</label>
      <p class="tiny muted" style="margin:0 0 16px 26px">Leave this off on a shared or public computer.</p>
      <button class="btn btn-block" type="submit" id="loginBtn">Sign in</button>
      <div class="hidden" id="loginAlt" style="margin-top:12px">
        <p class="tiny" style="color:var(--gold);margin-bottom:8px">Couldn't reach the backend. Your key wasn't checked.</p>
        <button class="btn btn-ghost btn-sm btn-block" type="button" id="offlineBtn">Continue in offline preview</button>
      </div>
    </form>
    <p class="tiny muted" style="margin-top:18px" id="loginHint"></p>
  </div>
</div>

<!-- ══════ CONSOLE ══════ -->
<div class="adm-shell hidden" id="shell">
  <aside class="adm-side">
    <div class="brand"><img src="assets/img/brand/logo.png" alt="Piranha Vibes"></div>
    <button class="nv on" data-tab="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg> Dashboard</button>
    <button class="nv" data-tab="orders"><svg viewBox="0 0 24 24"><path d="M6 7h12l1 13H5L6 7Z" stroke-linejoin="round"/><path d="M9 7V6a3 3 0 0 1 6 0v1" stroke-linecap="round"/></svg> Orders <span class="pill new" id="navNew" style="margin-left:auto"></span></button>
    <button class="nv" data-tab="products"><svg viewBox="0 0 24 24"><path d="M4 7 12 3l8 4v10l-8 4-8-4V7Z" stroke-linejoin="round"/><path d="m4 7 8 4 8-4M12 11v10" stroke-linejoin="round"/></svg> Products</button>
    <button class="nv" data-tab="coupons"><svg viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z" stroke-linejoin="round"/></svg> Coupons</button>
    <button class="nv" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z" stroke-linejoin="round"/></svg> Settings</button>
    <div class="sp" style="flex:1"></div>
    <button class="nv" id="refreshBtn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg> Refresh</button>
    <button class="nv" id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M15 17l5-5-5-5M20 12H9M12 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h6" stroke-linecap="round" stroke-linejoin="round"/></svg> Sign out</button>
  </aside>

  <main class="adm-main">
    <div id="offlineNote"></div>
    <section id="tab-dash"></section>
    <section id="tab-orders" class="hidden"></section>
    <section id="tab-products" class="hidden"></section>
    <section id="tab-coupons" class="hidden"></section>
    <section id="tab-settings" class="hidden"></section>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
